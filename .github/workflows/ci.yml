name: CI

# Budget (Zaid, 15 Oct): $5 of Actions until 1 Nov, repo stays private. So GitHub runs only once
# per merge to main, to deploy staging. Every check (lint, typecheck, unit, build, all e2e) runs
# in the session before a merge instead; finished tasks are merged in batches. The full suite
# can still be started by hand (Actions → CI → Run workflow) when it is worth the minutes.
# Paused (Zaid, 30 Oct): manual runs only. To resume, add back under `on:`:
#   push:
#     branches: [main]
#     paths-ignore: ['docs/**', '**/*.md']
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (core coverage ≥ 90 % lines)
        run: pnpm test

      - name: Build collector
        run: pnpm --filter collector build

      # OpenNext runs `next build` itself (the .next output also serves the e2e tests), so the
      # web app is built once, not twice.
      - name: Build web + Worker bundle (OpenNext)
        run: pnpm --filter web build:worker

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium

      - name: E2E smoke
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      target: staging
    secrets: inherit
